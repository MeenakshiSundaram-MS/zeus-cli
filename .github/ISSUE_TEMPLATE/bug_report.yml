name: Bug Report
description: Report a reproducible problem in Zeus.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Zeus. Please remove secrets, private contact data, and local paths you do not want to share.
  - type: input
    id: version
    attributes:
      label: Zeus version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: node --version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: What command or interactive input triggered the issue?
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true
